name: VLM Quality Gate

on:
  push:
    branches:
      - main

jobs:
  quality-evaluation:
    runs-on: ubuntu-latest

    # 1. Spin up ephemeral Cloud Memory
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: vlm_metrics
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize Database Schema
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=1234 psql -h localhost -p 5433 -U root -d vlm_metrics -f backend/schema.sql

      - name: Install MLOps Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Curated Benchmark Data
        run: |
          cd backend
          python download_data.py

      - name: Execute Quality Gate (Bouncer -> Brain)
        run: |
          cd backend
          
          echo "--- 1. Running Drift Detector ---"
          python drift_detector.py
          
          echo "--- 2. Running Evaluation Engine ---"
          python eval_engine.py