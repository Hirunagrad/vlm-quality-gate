name: VLM Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MLOps Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Evaluation Engine & Enforce Quality Gate
        run: |
          cd backend
          python eval_engine.py
          if [ $? -ne 0 ]; then
            echo "🚨 QUALITY GATE BLOCKED: Hallucination or Drift threshold exceeded."
            exit 1
          else
            echo "✅ QUALITY GATE PASSED: Model safe for deployment."
          fi