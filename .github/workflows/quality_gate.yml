name: VLM Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-evaluation:
    runs-on: ubuntu-latest
    
    # 1. Spin up ephemeral Cloud Memory
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: vlm_metrics
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 2. Build the evaluations table in the cloud database
      - name: Initialize Database Schema
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=1234 psql -h localhost -p 5433 -U root -d vlm_metrics -f backend/schema.sql

      - name: Install MLOps Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Evaluation Engine & Enforce Quality Gate
        run: |
          cd backend
          python eval_engine.py
          if [ $? -ne 0 ]; then
            echo "🚨 QUALITY GATE BLOCKED: Hallucination or Drift threshold exceeded."
            exit 1
          else
            echo "✅ QUALITY GATE PASSED: Model safe for deployment."
          fi